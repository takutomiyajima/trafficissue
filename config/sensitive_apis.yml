location:
  apis:
    - class: Landroid/location/LocationManager;
      methods: [getLastKnownLocation, requestLocationUpdates]
    - class: Lcom/google/android/gms/location/FusedLocationProviderClient;
      methods: [getLastLocation, requestLocationUpdates]
contacts:
  apis:
    - class: Landroid/provider/ContactsContract;
      methods: [query]
device_identifier:
  apis:
    - class: Landroid/provider/Settings$Secure;
      methods: [getString]
    - class: Landroid/telephony/TelephonyManager;
      methods: [getDeviceId, getImei]
camera:
  apis:
    - class: Landroid/hardware/camera2/CameraManager;
      methods: [openCamera]
audio:
  apis:
    - class: Landroid/media/MediaRecorder;
      methods: [start]
    - class: Landroid/media/AudioRecord;
      methods: [startRecording]
